name: Build Desktop Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: false
        default: ''

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ★ Print commit info to verify which code is being built
      - name: Verify source code
        run: |
          echo "=== Building commit: $(git rev-parse --short HEAD) ==="
          echo "=== Commit message: $(git log -1 --pretty=format:'%s') ==="
          echo "=== Date: $(git log -1 --pretty=format:'%ci') ==="
          echo "=== index.js FRAPPE_URL ==="
          findstr "FRAPPE_URL" src/main/index.js || echo "NOT FOUND"
          echo "=== Menu.setApplicationMenu ==="
          findstr "setApplicationMenu" src/main/index.js || echo "NOT FOUND"
          echo "=== isQuitting ==="
          findstr "isQuitting" src/main/index.js || echo "NOT FOUND"
        shell: cmd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ★ Clean install, no cache
      - name: Install dependencies
        run: |
          npm cache clean --force
          npm install --no-cache
        shell: cmd

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Build Windows installer
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OptiBot-ERP-Windows-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            build/*.exe
            build/latest.yml
          retention-days: 30

  build-mac:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify source code
        run: |
          echo "=== Building commit: $(git rev-parse --short HEAD) ==="
          grep "FRAPPE_URL" src/main/index.js
          grep "setApplicationMenu" src/main/index.js
          grep "isQuitting" src/main/index.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm install --no-cache

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Build macOS installer
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OptiBot-ERP-macOS-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            build/*.dmg
            build/*.zip
            build/latest-mac.yml
          retention-days: 30

  release:
    name: Create Release
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: OptiBot-ERP-Windows-*
          path: artifacts/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: OptiBot-ERP-macOS-*
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/latest*.yml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
